<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e5a57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cajas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Inventario de cajas</title>
<style>
:root{--bg:#f4f5f2;--fg:#17211f;--mut:#5d6965;--card:#fff;--line:#d9ddd7;--acc:#0e5a57;--accfg:#fff;--tape:#f0c53a;--tapefg:#3a2c00}
@media(prefers-color-scheme:dark){:root{--bg:#121a19;--fg:#e9efec;--mut:#9aa8a3;--card:#1b2624;--line:#2c3a37;--acc:#4fb3ad;--accfg:#08201e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:6px 0 14px;letter-spacing:-.01em}
h2{font-size:21px;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button,input,select{font:inherit;color:inherit}
button{min-height:44px;border:1px solid var(--line);background:var(--card);padding:0 14px;border-radius:10px}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button.d{color:#c0392b}
input,select{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
input[type=checkbox]{width:20px;min-height:20px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.mut,small{color:var(--mut)}
.tag{display:inline-block;background:var(--tape);color:var(--tapefg);font-weight:700;font-size:13px;padding:1px 8px;border-radius:3px;margin-right:6px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 10px;margin:4px 6px 0 0;font-size:14px}
.cb{min-height:36px;padding:0 12px;margin:2px}
.cb.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.ir{display:flex;gap:10px;align-items:center;margin:10px 0}
.ir.s{margin:6px 0}
.th,.ph{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none}
.ir.s .th{width:36px;height:36px}
.ph{border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.f{flex:1;display:grid;gap:6px;min-width:0}
.qr{width:230px;max-width:70%;margin:14px auto;display:block;border:1px solid var(--line);border-radius:6px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
#scan{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;color:#fff}
#vid{width:100%;max-width:480px;border-radius:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:15px;z-index:10}
#labels{display:none}
@media print{
 body>*:not(#labels){display:none!important}
 #labels{display:grid!important;grid-template-columns:repeat(3,1fr);gap:6mm}
 .lab{break-inside:avoid;border:1px dashed #888;padding:4mm;text-align:center;color:#000;background:#fff}
 .lab svg{width:100%;height:auto}.lab b{display:block;font-size:14pt;margin-top:2mm}.lab span{font-size:9pt}
}
</style>
</head>
<body>
<main id="app"></main>
<div id="scan" hidden><video id="vid" playsinline muted></video><div id="scanmsg">Apunta al QR de la caja</div><button id="scanx">Cerrar</button></div>
<div id="labels"></div><div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const ROOMS=['Cocina','Oficina','Recámara','Baño','Sala','Garage','Otra'],STATES=['Empacada','En almacén','En camino','Desempacada'];
let boxes={},view='list',route='',q='',cat='',draft=null,edId=null,pend=0,scanning=false,confirmDel=false;

const DB=(()=>{let d;const open=()=>d||(d=new Promise((ok,no)=>{const r=indexedDB.open('cajas',1);r.onupgradeneeded=()=>r.result.createObjectStore('boxes',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
const tx=async(m,f)=>{const db=await open();return new Promise((ok,no)=>{const t=db.transaction('boxes',m),r=f(t.objectStore('boxes'));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)})};
return{all:()=>tx('readonly',s=>s.getAll()),put:b=>tx('readwrite',s=>s.put(b)),del:id=>tx('readwrite',s=>s.delete(id))}})();

const toast=t=>{const e=$('#toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2600)};
const newId=()=>'c'+Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,4);
const items=b=>b.items||[];
const cats=()=>[...new Set(Object.values(boxes).flatMap(b=>items(b).map(i=>i.c)).filter(Boolean))].sort();
const rooms=()=>[...new Set([...ROOMS,...Object.values(boxes).map(b=>b.room).filter(Boolean)])];
const save=async b=>{b.t=Date.now();boxes[b.id]=b;try{await DB.put(b)}catch(e){toast('No se pudo guardar')}};
const frag=b=>items(b).some(i=>i.f);
const img=p=>p?`<img class="th" src="${p}" alt="">`:'';
const tag=b=>`<span class="tag">P${b.prio||1}</span>`;

function qrText(b){const l=items(b).map(i=>(i.q>1?i.q+' ':'')+i.n).join('; ');return `CAJA ${b.id}\n${b.name} / ${b.room||'sin habitación'} / P${b.prio||1}\n`+(l.length>160?l.slice(0,160)+'…':l)}
function qrSvg(text){
 const k=qrcode(0,'M');k.addData(unescape(encodeURIComponent(text)));k.make();const n=k.getModuleCount();let d='';
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(k.isDark(r,c))d+=`M${c+4} ${r+4}h1v1h-1z`;
 return `<svg viewBox="0 0 ${n+8} ${n+8}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function printLabels(ids){
 $('#labels').innerHTML=ids.map(id=>{const b=boxes[id];return `<div class="lab">${qrSvg(qrText(b))}<b>${esc(b.name)}</b><span>${esc(b.room||'')} P${b.prio||1}</span></div>`}).join('');
 setTimeout(()=>window.print(),60);
}
function shrink(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.75))};im.onerror=no;im.src=u})}

function render(){
 const a=$('#app');
 if(view==='edit')return edit(a);
 if(view==='unpack')return unpack(a);
 if(route&&boxes[route])return detail(a,boxes[route]);
 list(a);
}

function list(a){
 a.innerHTML=`<h1>📦 Inventario de cajas</h1>${route?'<p class="mut">No encontré esa caja.</p>':''}
 <input id="q" type="search" placeholder="¿Qué estás buscando?" value="${esc(q)}">
 <div class="row"><button class="p" id="nw">+ Nueva caja</button><button id="sc">Escanear</button><button id="up">Desempacar</button></div>
 <div id="cf"></div><div id="res"></div>
 <details style="margin-top:24px"><summary class="mut">Respaldo y etiquetas</summary>
 <div class="row"><button id="ex">Exportar respaldo</button><button id="im">Importar respaldo</button><button id="pa">Imprimir todas las etiquetas</button></div>
 <input type="file" id="imf" accept=".json,application/json" hidden></details>`;
 $('#q').oninput=e=>{q=e.target.value;results()};
 $('#nw').onclick=()=>{draft=null;edId=null;view='edit';render()};
 $('#sc').onclick=scan;
 $('#up').onclick=()=>{view='unpack';render()};
 $('#ex').onclick=exportJ;
 $('#im').onclick=()=>$('#imf').click();
 $('#imf').onchange=importJ;
 $('#pa').onclick=()=>{const ids=Object.keys(boxes);ids.length?printLabels(ids):toast('Aún no hay cajas')};
 results();
}
function results(){
 const k=norm(q.trim()),all=cats();
 $('#cf').innerHTML=all.length?['',...all].map(c=>`<button class="cb${c===cat?' on':''}" data-c="${esc(c)}">${c?esc(c):'Todas'}</button>`).join(''):'';
 document.querySelectorAll('.cb').forEach(x=>x.onclick=()=>{cat=x.dataset.c;results()});
 const out=[];
 for(const b of Object.values(boxes).sort((x,y)=>(x.prio||1)-(y.prio||1)||x.name.localeCompare(y.name))){
  const its=items(b),hits=(k||cat)?its.filter(i=>(!cat||i.c===cat)&&(!k||norm(i.n).includes(k)||norm(i.c).includes(k))):[];
  if((k||cat)&&!hits.length&&!(k&&!cat&&(norm(b.name).includes(k)||norm(b.room).includes(k))))continue;
  out.push(`<div class="card" data-id="${esc(b.id)}">${tag(b)}<b>${esc(b.name)}</b><br><small>${esc(b.room||'Sin habitación')}, ${esc(b.status||'Empacada')}, ${its.length} objetos${frag(b)?', con frágiles':''}</small>${hits.map(h=>`<div class="ir s">${img(h.p)}<span>${esc(h.n)}${h.c?` <span class="chip">${esc(h.c)}</span>`:''}</span></div>`).join('')}</div>`);
 }
 $('#res').innerHTML=out.join('')||`<p class="mut">${Object.keys(boxes).length?'Nada coincide con tu búsqueda.':'Crea tu primera caja con “Nueva caja”.'}</p>`;
 document.querySelectorAll('.card[data-id]').forEach(c=>c.onclick=()=>{location.hash=c.dataset.id});
}

function detail(a,b){
 a.innerHTML=`<div class="row"><button id="bk">← Cajas</button></div>
 <h2>${tag(b)}${esc(b.name)}</h2><small>${esc(b.room||'Sin habitación')}, código ${esc(b.id)}</small>
 <div class="row"><select id="st">${STATES.map(s=>`<option${s===(b.status||'Empacada')?' selected':''}>${s}</option>`).join('')}</select></div>
 ${items(b).map(i=>`<div class="ir">${img(i.p)}<div><b>${esc(i.n)}</b>${i.q>1?` ×${i.q}`:''}${i.f?' ⚠️ frágil':''}${i.c?`<br><span class="chip">${esc(i.c)}</span>`:''}</div></div>`).join('')||'<p class="mut">Sin objetos todavía</p>'}
 <div class="qr">${qrSvg(qrText(b))}</div>
 <div class="row" style="justify-content:center"><button class="p" id="pr">Imprimir etiqueta</button><button id="ed">Editar</button><button class="d" id="dl">${confirmDel?'¿Seguro? Toca otra vez':'Eliminar'}</button></div>`;
 $('#bk').onclick=()=>{confirmDel=false;location.hash=''};
 $('#st').onchange=async e=>{b.status=e.target.value;await save(b);toast('Estado guardado')};
 $('#pr').onclick=()=>printLabels([b.id]);
 $('#ed').onclick=()=>{draft=null;edId=b.id;view='edit';render()};
 $('#dl').onclick=async()=>{if(!confirmDel){confirmDel=true;render();return}confirmDel=false;delete boxes[b.id];await DB.del(b.id);location.hash=''};
}

function sync(){if(!draft||!$('#nm'))return;draft.name=$('#nm').value;draft.room=$('#rm').value;draft.prio=+$('#pr').value;
 draft.items.forEach((d,i)=>{d.n=$('#n'+i).value;d.c=$('#c'+i).value;d.q=Math.max(1,+$('#q'+i).value||1);d.f=$('#f'+i).checked})}
function edit(a){
 if(!draft){const b=edId?boxes[edId]:null;draft={name:b?b.name:'',room:b?b.room||'':'',prio:b?b.prio||1:1,items:b&&items(b).length?items(b).map(x=>({...x})):[{n:'',c:'',q:1,f:false,p:''}]}}
 a.innerHTML=`<h1>${edId?'Editar caja':'Nueva caja'}</h1>
 <input id="nm" value="${esc(draft.name)}" placeholder="Nombre (ej. Cocina 1)">
 <div class="row"><input id="rm" list="rooms" value="${esc(draft.room)}" placeholder="Habitación" style="flex:2"><select id="pr" style="flex:1">${[1,2,3].map(n=>`<option value="${n}"${n==draft.prio?' selected':''}>Prioridad ${n}</option>`).join('')}</select></div>
 <datalist id="rooms">${rooms().map(r=>`<option value="${esc(r)}">`).join('')}</datalist><datalist id="cats">${cats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <p class="mut">Objetos: foto, nombre, categoría y cantidad</p>
 ${draft.items.map((d,i)=>`<div class="ir"><div class="ph" data-i="${i}">${d.p?`<img src="${d.p}" alt="">`:'📷'}</div><div class="f"><input id="n${i}" value="${esc(d.n)}" placeholder="Objeto (ej. Rompecabezas 500 piezas)"><div class="row" style="margin:0"><input id="c${i}" list="cats" value="${esc(d.c)}" placeholder="Categoría" style="flex:2"><input id="q${i}" type="number" inputmode="numeric" min="1" value="${d.q||1}" style="flex:1"></div><label class="mut"><input type="checkbox" id="f${i}"${d.f?' checked':''}> Frágil</label></div><button class="d" data-rm="${i}">✕</button></div>`).join('')}
 <input type="file" id="fl" accept="image/*" hidden>
 <div class="row"><button id="ad">+ Agregar objeto</button></div>
 <div class="row"><button class="p" id="sv">Guardar</button><button id="cx">Cancelar</button></div>`;
 $('#cx').onclick=()=>{draft=null;view='list';render()};
 $('#ad').onclick=()=>{sync();draft.items.push({n:'',c:'',q:1,f:false,p:''});render()};
 document.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{sync();draft.items.splice(+x.dataset.rm,1);if(!draft.items.length)draft.items.push({n:'',c:'',q:1,f:false,p:''});render()});
 document.querySelectorAll('.ph').forEach(x=>x.onclick=()=>{pend=+x.dataset.i;$('#fl').click()});
 $('#fl').onchange=async e=>{const f=e.target.files[0];if(!f)return;sync();try{draft.items[pend].p=await shrink(f);render()}catch(x){toast('No se pudo leer la foto')}};
 $('#sv').onclick=async()=>{sync();
  const old=edId?boxes[edId]:null,b={id:edId||newId(),name:draft.name.trim()||'Caja sin nombre',room:draft.room.trim(),prio:draft.prio,status:old?old.status:'Empacada',
   items:draft.items.filter(d=>d.n.trim()).map(d=>({n:d.n.trim(),c:d.c.trim(),q:d.q,f:d.f,p:d.p||''}))};
  await save(b);draft=null;view='list';location.hash=b.id;render()};
}

function unpack(a){
 const all=Object.values(boxes),done=all.filter(b=>b.status==='Desempacada').length,
  todo=all.filter(b=>b.status!=='Desempacada').sort((x,y)=>(x.prio||1)-(y.prio||1)||(x.room||'').localeCompare(y.room||''));
 a.innerHTML=`<div class="row"><button id="bk">← Cajas</button></div><h2>Qué desempacar primero</h2>
 <p class="mut">${done} de ${all.length} cajas desempacadas</p><div class="bar"><i style="width:${all.length?done/all.length*100:0}%"></i></div>
 ${todo.map(b=>`<label class="card" style="display:flex;gap:12px;align-items:center"><input type="checkbox" data-u="${esc(b.id)}"><span>${tag(b)}<b>${esc(b.room||'Sin habitación')}</b><br>${esc(b.name)}${frag(b)?' ⚠️':''}<br><small>${items(b).length} objetos, ${esc(b.status||'Empacada')}</small></span></label>`).join('')||'<p class="mut">No hay cajas pendientes.</p>'}`;
 $('#bk').onclick=()=>{view='list';render()};
 document.querySelectorAll('[data-u]').forEach(x=>x.onchange=async()=>{const b=boxes[x.dataset.u];b.status='Desempacada';await save(b);render()});
}

async function scan(){
 const v=$('#vid');$('#scan').hidden=false;$('#scanmsg').textContent='Apunta al QR de la caja';
 let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}
 catch(e){$('#scanmsg').textContent='No se pudo abrir la cámara. Revisa el permiso en Ajustes.';return}
 v.srcObject=st;await v.play();scanning=true;
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 const tick=()=>{if(!scanning)return;
  if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
   const im=cx.getImageData(0,0,cv.width,cv.height),r=jsQR(im.data,im.width,im.height),m=r&&r.data.match(/^CAJA\s+(\S+)/);
   if(m){stopScan();if(boxes[m[1]]){view='list';location.hash=m[1];render()}else toast('Esa caja no está en este inventario');return}}
  requestAnimationFrame(tick)};
 tick();
}
function stopScan(){scanning=false;const v=$('#vid');if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}$('#scan').hidden=true}
$('#scanx').onclick=stopScan;

async function exportJ(){
 const blob=new Blob([JSON.stringify({v:1,boxes:Object.values(boxes)})],{type:'application/json'}),
  f=new File([blob],'inventario-cajas-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
 const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=f.name;l.click();setTimeout(()=>URL.revokeObjectURL(u),5000);
}
async function importJ(e){
 const f=e.target.files[0];if(!f)return;
 try{const d=JSON.parse(await f.text());let n=0;
  for(const b of d.boxes||[]){if(!b.id)continue;const o=boxes[b.id];if(!o||(b.t||0)>(o.t||0)){boxes[b.id]=b;await DB.put(b);n++}}
  toast(n+' cajas importadas');render()}catch(x){toast('Ese archivo no es un respaldo válido')}
}

window.addEventListener('hashchange',()=>{route=decodeURIComponent(location.hash.slice(1));view='list';confirmDel=false;render()});
(async()=>{
 try{(await DB.all()).forEach(b=>boxes[b.id]=b)}catch(e){toast('No se pudo abrir el almacenamiento')}
 route=decodeURIComponent(location.hash.slice(1));render();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
